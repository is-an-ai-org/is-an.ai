name: Runner Connection Test
run-name: Verify ADMIN_API_KEY without changing records

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admin-api-key:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify administrator API authentication
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.ok(process.env.ADMIN_API_KEY, 'ADMIN_API_KEY is not configured in Actions.');
          const response = await fetch('https://api.is-an.ai/admin/domain-count?email=admin-key-check%40example.invalid', {
            headers: { 'X-Admin-Key': process.env.ADMIN_API_KEY },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          console.log(`Admin API HTTP ${response.status}`);
          assert.equal(response.status, 200, `Admin API rejected verification (HTTP ${response.status}).`);
          const result = await response.json();
          assert.equal(result.email, 'admin-key-check@example.invalid');
          assert.ok(Number.isInteger(result.count));
          assert.equal(typeof result.allowed, 'boolean');
          console.log('Admin API authentication passed; no records were changed.');
          JS
