name: Sync DNS Records (Full Sync)

on:
  # 하루에 한 번 전체 동기화. 드리프트 감지 및 수정.
  # (2026-09-05 되살림. 첫 전체 동기화에서 마스터에만 있고 HE 에는 없는
  #  레코드 1건이 실제로 나왔다 — serial 을 올리지 않고 존을 직접 건드린
  #  흔적이다. 이 cron 이 그런 것을 하루 안에 잡는다.)
  schedule:
    - cron: "0 2 * * *" # UTC 기준 매일 오전 2시 (한국시간 오전 11시)
    - cron: "7,22,37,52 * * * *"
  # 수동 실행도 가능
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run (show changes without applying them)"
        required: false
        default: false
        type: boolean
      notify_only:
        description: "Resend NOTIFY and verify public DNS without changing records or SOA serial"
        required: false
        default: false
        type: boolean
      probe_name:
        description: "Hostname to verify (enabled A/AAAA/CNAME; empty uses www in the managed zone)"
        required: false
        type: string

# deploy-dns.yml과 같은 그룹을 공유한다.
# cron 전체 동기화와 push 증분 배포가 동시에 SOA serial을 read-modify-write 하는 경합을 제거한다.
concurrency:
  group: ${{ github.event_name == 'schedule' && github.event.schedule != '0 2 * * *' && 'pdns-verify' || 'pdns-write' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node and compile scripts
        uses: ./.github/actions/setup

      - name: Sync DNS Records
        if: ${{ !inputs.notify_only && (github.event_name != 'schedule' || github.event.schedule == '0 2 * * *') }}
        env:
          PDNS_API_URL: http://pdns-auth:8081
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}
          PDNS_ZONE: ${{ secrets.PDNS_ZONE }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NODE_OPTIONS: "--max-old-space-size=512" # 메모리 제한 (512MB)
        run: node .github/scripts/sync-pdns-dns.js
        timeout-minutes: 10 # 최대 실행 시간 10분 (무한 실행 방지)

      - name: Verify public DNS propagation
        if: ${{ inputs.notify_only || !inputs.dry_run }}
        env:
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}
          PDNS_API_URL: http://pdns-auth:8081
          PDNS_ZONE: ${{ secrets.PDNS_ZONE }}
          NOTIFY_ONLY: ${{ inputs.notify_only || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          DNS_PROBE_NAME: ${{ inputs.probe_name }}
        run: node .github/scripts/verify-pdns.js
        timeout-minutes: 10

  report-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    concurrency:
      group: pdns-failure-alert
      cancel-in-progress: false
    steps:
      - name: Create Issue on Sync Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'DNS sync or public propagation failed';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            if (existing.some(issue => issue.title === title)) {
              console.log('An open DNS failure issue already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `DNS sync or public propagation verification failed. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for the affected nameservers and records.`,
              labels: ['dns', 'sync-failure', 'urgent']
            })
