name: Sync DNS Records (Full Sync)

on:
# ⛔ org 이전용 — 초기 임포트 동안 자동 실행을 끈다.
#    ORG-CUTOVER.md Phase 0-4 / Phase 4-16 참조. 검증 끝나면 되살린다.
  # 하루에 한 번 자동 실행 (전체 동기화로 드리프트 감지 및 수정)
  # schedule:
  #   - cron: "0 2 * * *" # UTC 기준 매일 오전 2시 (한국시간 오전 11시)
  # 수동 실행도 가능
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run (show changes without applying them)"
        required: false
        default: false
        type: boolean

# deploy-dns.yml과 같은 그룹을 공유한다.
# cron 전체 동기화와 push 증분 배포가 동시에 SOA serial을 read-modify-write 하는 경합을 제거한다.
concurrency:
  group: pdns-write
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node and compile scripts
        uses: ./.github/actions/setup

      - name: Sync DNS Records
        env:
          PDNS_API_URL: http://pdns-auth:8081
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}
          PDNS_ZONE: ${{ secrets.PDNS_ZONE }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NODE_OPTIONS: "--max-old-space-size=512" # 메모리 제한 (512MB)
        run: node .github/scripts/sync-pdns-dns.js
        timeout-minutes: 10 # 최대 실행 시간 10분 (무한 실행 방지)

      - name: Create Issue on Sync Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'DNS Sync Failed - ' + new Date().toISOString().split('T')[0],
              body: `The DNS sync (${context.eventName}) failed on ${new Date().toISOString()}.
              
              Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.
              
              This could indicate:
              - PowerDNS API issues
              - Invalid record configurations
              - Network connectivity problems
              
              Manual intervention may be required.`,
              labels: ['dns', 'sync-failure', 'urgent']
            })
