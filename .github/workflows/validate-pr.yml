name: Validate PR

on:
  pull_request_target:
    paths:
      - "records/**"
    types:
      - opened
      - synchronize
      - reopened

# 같은 PR에 force-push가 연달아 오면 이전 검증 런을 취소한다.
# (auto-merge 스텝 전까지는 read-only라 취소해도 부작용이 없다)
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout base branch (trusted scripts)
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Check PR author moderation status
        env:
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_MODERATION_KEY: ${{ secrets.PR_MODERATION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_MODERATION_KEY" || ! "$PR_AUTHOR_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to check PR author moderation status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' \
            -H "X-Admin-Key: $PR_MODERATION_KEY" \
            "https://api.is-an.ai/admin/github-users/$PR_AUTHOR_ID/ban")
          case "$status" in
            204) ;;
            403) echo "This account is banned from is-an.ai."; exit 1 ;;
            *) echo "Moderation status check failed (HTTP $status)."; exit 1 ;;
          esac

      # Fetch PR head to diff record files only
      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

      - name: Set up Node and compile scripts
        uses: ./.github/actions/setup

      - name: Reject PRs with non-record file changes
        run: |
          BASE_SHA=$(git merge-base HEAD origin/pr-head)
          NON_RECORD_FILES=$(git diff --no-renames --name-only "$BASE_SHA" origin/pr-head | grep -E -v '^records/[^/]+\.json$' || true)
          TYPE_CHANGES=$(git diff --no-renames --name-only --diff-filter=T "$BASE_SHA" origin/pr-head)
          if [ -n "$TYPE_CHANGES" ] || ! git diff --quiet "$BASE_SHA" origin/pr-head -- records/schema.json; then
            echo "Record file type and schema changes require a maintainer."
            exit 1
          fi
          if [ -n "$NON_RECORD_FILES" ]; then
            echo "❌ PR contains changes outside records/*.json:"
            echo "$NON_RECORD_FILES"
            echo "Auto-merge is only allowed for record-only PRs."
            exit 1
          fi

      - name: Get changed files
        id: changes
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base HEAD origin/pr-head)

          # 개행 구분 + heredoc 구분자.
          # 공백으로 join 하면 records/"y\u2006t\u2006k.json" 처럼 유니코드 공백이
          # 든 파일명이 여러 개로 쪼개진다(그런 파일이 실제로 있다).
          emit() { # $1=output name, $2=diff-filter
            local name="$1" filter="$2" files
            files=$(git diff --no-renames --name-only --diff-filter="$filter" "$BASE_SHA" origin/pr-head -- 'records/**.json' | grep -v '^records/schema\.json$' || true)
            echo "--- $name ---"
            echo "${files:-(none)}"
            {
              echo "${name}<<__EOF_${name}__"
              echo "$files"
              echo "__EOF_${name}__"
            } >> "$GITHUB_OUTPUT"
          }

          emit added A
          emit modified M
          emit deleted D

          COMMIT_EMAILS=$(git log "$BASE_SHA"..origin/pr-head --format=%ae | sort -u)
          {
            echo "commit_emails<<__EOF_EMAILS__"
            echo "$COMMIT_EMAILS"
            echo "__EOF_EMAILS__"
          } >> "$GITHUB_OUTPUT"

      # Checkout only record files from PR (untrusted data, not scripts)
      - name: Checkout PR record files
        run: |
          git checkout origin/pr-head -- records/ 2>/dev/null || true

      - name: Run validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          ADDED_FILES: ${{ steps.changes.outputs.added }}
          MODIFIED_FILES: ${{ steps.changes.outputs.modified }}
          DELETED_FILES: ${{ steps.changes.outputs.deleted }}
          COMMIT_EMAILS: ${{ steps.changes.outputs.commit_emails }}
        run: node .github/scripts/validate-pr.js
        timeout-minutes: 5

      - name: Generate App token
        if: success()
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
