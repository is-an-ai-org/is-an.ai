name: Test DNS scripts
on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/test-scripts.yml'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/test-scripts.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
